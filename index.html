<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reto Tecnico</title>
    <link rel="stylesheet" href="style.css">
</head>

 <body>
    <main class="container">
        <div class="visual-section">
            <div class="logo">Nucleus</div>
        </div>

        <div class="form-section">
            <h2>Create your account</h2>
            <p>Join Nucleus UI and start designing with ease.</p>

            <form id="registerForm" onsubmit="verifiarPassword(); return false">
                <div>
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Enter your username"  required>
                </div>
                
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="jtavera@gmail.com" required>

                <label for="password">Password</label>
                <div class="password-container">
                    <input type="password" id="password" placeholder="............." required>
                    <span class="eye" id="togglePassword">👁️</span>

                </div>
                <span id="passError" style="color:red;font-size: 11px; display:none,">It must have 8 characters, 1 uppercase letter, 1 number, and 1 special character </span>
                
                <label for="confirmPassword">Confirm password</label>
                <div class="password-container">
                   <input type="password" id="confirmPassword" placeholder="........." required>
                   <span class="eye" id="toggleConfirm">👁️</span>
                </div>
                
                <span id="matchError" style="color:red;font-size: 11px; display:none,">The passwords do not match</span>
                

                <button type="submit">Create account</button>
                
            </form>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
