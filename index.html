<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reto Tecnico</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 <body>
    <main class="container">
        <div class="visual-section">
            <div class="logo">Nucleus</div>
        </div>

        <div class="form-section">
            <h2>Create your account</h2>
            <p>Join Nucleus UI and start designing with ease.</p>

            <form id="registerForm">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Juan Tavera" required>

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="jtavera@gmail.com" required>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="............." required>

                <label for="confirmPassword">Confirm password</label>
                <input type="password" id="confirmPassword" placeholder="........." required>

                <button type="submit">Create account</button>
            </form>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
